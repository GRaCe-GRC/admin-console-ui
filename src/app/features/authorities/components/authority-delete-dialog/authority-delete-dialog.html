<div class="head">
  <div>
    <h2 id="delete-title">Delete authority?</h2>
    @if (authority(); as current) {
      <p data-testid="delete-text"><b>{{ current.name }}</b> will be removed from the regulatory database. This cannot be undone.</p>
    }
  </div>
  <button class="close" type="button" aria-label="Close" data-testid="delete-close" (click)="cancelled.emit()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18" />
    </svg>
  </button>
</div>

@if (error(); as message) {
  <p class="form-error" role="alert" data-testid="delete-error">{{ message }}</p>
}

<div class="foot">
  <button class="btn" type="button" data-testid="cancel-delete" (click)="cancelled.emit()">Cancel</button>
  <button class="btn danger" type="button" data-testid="confirm-delete" [disabled]="deleting() || !authority()" (click)="confirm()">
    Delete
  </button>
</div>
