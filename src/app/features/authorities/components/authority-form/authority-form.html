<div class="band"></div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="head">
    <div>
      <h2 id="create-title">New authority</h2>
      <p>It is created enabled, by {{ userName }}.</p>
    </div>
    <button class="close" type="button" aria-label="Close" data-testid="close" (click)="cancelled.emit()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>

  <div class="body">
    <div class="field" [class.invalid]="fieldError('name')">
      <label for="authority-name">Name</label>
      <input
        #nameInput
        id="authority-name"
        formControlName="name"
        name="name"
        maxlength="255"
        autocomplete="off"
        placeholder="e.g. European Securities and Markets Authority"
        [attr.aria-invalid]="fieldError('name') ? true : null"
        [attr.aria-describedby]="fieldError('name') ? 'authority-name-error' : null"
      />
      @if (fieldError('name'); as message) {
        <span class="err" id="authority-name-error" data-testid="name-error">{{ message }}</span>
      }
    </div>

    <div class="field" [class.invalid]="fieldError('jurisdiction')">
      <label for="authority-jurisdiction">Jurisdiction</label>
      <input
        id="authority-jurisdiction"
        formControlName="jurisdiction"
        name="jurisdiction"
        maxlength="255"
        autocomplete="off"
        placeholder="e.g. EU"
        [attr.aria-invalid]="fieldError('jurisdiction') ? true : null"
        [attr.aria-describedby]="fieldError('jurisdiction') ? 'authority-jurisdiction-error' : null"
      />
      @if (fieldError('jurisdiction'); as message) {
        <span class="err" id="authority-jurisdiction-error" data-testid="jurisdiction-error">{{ message }}</span>
      }
    </div>

    @if (formError(); as message) {
      <p class="form-error" role="alert" data-testid="create-error">{{ message }}</p>
    }
  </div>

  <div class="foot">
    <button class="btn" type="button" data-testid="cancel" (click)="cancelled.emit()">Cancel</button>
    <button class="btn primary" type="submit" [disabled]="submitting()">Create authority</button>
  </div>
</form>
